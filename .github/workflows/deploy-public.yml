# Deploys the LEAGUE'S PUBLIC SITE, rinkhockeyil.com.
#
# READ THIS FIRST IF YOU ARE HERE IN A HURRY:
#   * This is the ONLY automated path to the public site. Nothing else deploys it.
#   * It runs ONLY when somebody presses the button — `workflow_dispatch`, never on
#     push. Landing code on a branch can therefore never publish to the league.
#     The button is normally pressed by /api/live-edit-promote (the admin panel's
#     "ship it" action), which merges `dev` into upstream `main` first; you can
#     also press it by hand from the Actions tab to re-ship whatever main holds.
#   * It ships THIS repo's `main` — sideffect263/hockey-league — and not the branch
#     this workflow file happens to live on. `main` is the public site's source of
#     truth, exactly as in scripts/deploy-public.sh.
#     It used to ship IdanLichter/hockey-league@main, with a PAT (UPSTREAM_TOKEN) as
#     the only credential able to write there. Both branches are in this repo now, so
#     that token is gone and so is the boundary it enforced. Note what follows: this
#     repo's `main` is a publish button. IdanLichter/hockey-league@main still feeds
#     hockey-league-pro.vercel.app, which nobody here controls, and it will now drift.
#   * To stop a bad deploy: cancel the run, then fix `main` upstream and run this
#     again. There is no rollback step here; Vercel's dashboard has instant rollback.
#
# This is the CI equivalent of scripts/deploy-public.sh, which does the same thing
# from Ariel's Mac (clean worktree at origin/main -> `vercel --prod`). That script
# stays the manual fallback and keeps its extra job of announcing the Android APK
# version to league_settings — so after publishing a new APK, run the script, not
# this.
#
# WHAT THIS DOES NOT DO, ON PURPOSE:
#   * No database step. There is only ONE Supabase project, shared by the dev site
#     and rinkhockeyil.com, so any migration has already been applied by the dev
#     deploy long before a promote reaches here. Re-applying it from a second
#     workflow could only ever do harm.
#   * No fence step. The promote path (api/live-edit-promote.js) refuses anything
#     touching supabase/, api/, .github/, src/lib/api.js, src/lib/supabase.js,
#     vercel.json or .env* before it will merge into main, and deploy-dev.yml
#     refuses the same set before anything lands on dev. By the time code is here it
#     has passed that fence twice — and a human running this by hand is deliberately
#     shipping whatever main holds, which is their call to make.
# NOT A REPLACEMENT FOR scripts/deploy-public.sh. That script does one more thing
# this workflow deliberately does not: it reads the version out of the APK actually
# being served and writes it to league_settings.android_latest_version, which is what
# tells sideloaded Android users a newer build exists. A UI promote does not ship an
# APK, so skipping it here is correct — but shipping an Android release still means
# running the script by hand, or the release goes out and nobody is ever told.

name: deploy public

on:
  # Manual/API trigger only. Adding a `push:` trigger here would hand every agent
  # with commit access a direct line to the league's website — don't.
  workflow_dispatch:

concurrency:
  # Two overlapping deploys of the same site would race to be last. Queue instead,
  # and never cancel one in flight: a half-uploaded deploy is worse than a slow one.
  group: deploy-public
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Read the repo, talk to Vercel with VERCEL_TOKEN, write nothing. Least
      # privilege: a publish step has no business pushing commits.
      contents: read
    env:
      # Hardcoded, like deploy-dev.yml, and for the same reason turned around: these
      # two ids ARE the public site. Pinning them here means a mistyped or swapped
      # secret can fail the deploy but can never point it at a different project.
      VERCEL_ORG_ID: team_LuBaggO3yTGb6EoNmLCZGCXA
      VERCEL_PROJECT_ID: prj_0DuFW7a6zra5uCw4Y5uEXPWvmsNL
    steps:
      # The code being published: this repo's `main`, and nothing else.
      - name: Check out main (the public site's source of truth)
        uses: actions/checkout@v4
        with:
          # `ref` is spelled out rather than left to default, because the default is
          # the ref this run was dispatched ON. Dispatching from `dev` would then
          # quietly publish dev to the league. It is always `main`, whatever branch
          # the button was pressed from. No `repository:`/`token:` — this is our own
          # repo now, so the job's GITHUB_TOKEN reads it.
          ref: main
          # Only the tip is built. Depth 1 keeps the checkout fast; the step below
          # still prints the exact commit because that is all anyone needs to know.
          fetch-depth: 1

      # Put the shipped commit in the log BEFORE the deploy, so that even a run that
      # dies halfway says on its face what it was trying to publish.
      - name: Announce the commit being shipped
        run: |
          set -euo pipefail
          echo "Shipping ${GITHUB_REPOSITORY}@main to rinkhockeyil.com:"
          git log -1 --pretty=format:'  %H%n  %an, %ad%n  %s' --date=iso
          echo
          {
            echo "### Shipping to rinkhockeyil.com"
            echo
            echo '```'
            git log -1 --pretty=format:'%H%n%an, %ad%n%s' --date=iso
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          # Matches .nvmrc and deploy-dev.yml. The public site must not be the place
          # a Node version difference first shows up.
          node-version: 20

      # Same three-step Vercel dance as deploy-dev.yml, which is the pattern already
      # proven to work with this token in this org:
      # ONE STEP, AND THE BUILD HAPPENS ON VERCEL'S SIDE — not here.
      #
      # The three-step version (pull → build → deploy --prebuilt) looks better: a
      # build failure would fail this run visibly. It also took the dev site down
      # the first time it ran. Vercel marks env vars added through `vercel env add`
      # as Sensitive, and Sensitive vars CANNOT BE READ BACK — `vercel pull` hands
      # you empty strings. The runner cheerfully built a bundle with an empty
      # VITE_SUPABASE_URL, deployed it, and every page died on load with
      # "Invalid supabaseUrl: Must be a valid HTTP or HTTPS URL". Nothing failed;
      # it just shipped a blank site.
      #
      # Deploying without --prebuilt makes Vercel build it, where the real values
      # live. scripts/deploy-public.sh has always done exactly this.
      - name: Deploy to rinkhockeyil.com
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
