<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-paint theme: apply the saved/system dark class before the bundle loads
         so dark-mode users don't get a white flash on every load. ThemeContext
         (key 'hockey-theme') remains the source of truth once React mounts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('hockey-theme');
          var dark = saved ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Smart App Banner (2026-10-26): Safari on iPhone/iPad shows "Get"/"Open" for the app.
         In-app web views never show it. -->
    <meta name="apple-itunes-app" content="app-id=6789331513" />
    <link rel="preconnect" href="https://api.rinkhockeyil.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="preload" href="/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin />

    <title>ליגת הוקי הגלגיליות הישראלית</title>
    <meta name="description" content="ליגת הוקי הגלגיליות הישראלית — טבלת הליגה המעודכנת, תוצאות ולוח משחקים, סטטיסטיקות שחקנים וקבוצות, שידורים חיים, גלריית תמונות וטורנירים. כל מה שקורה במגרש, במקום אחד." />
    <!-- No static canonical: this shell is served for EVERY route, so one here
         told Google that all ~150 pages were copies of the homepage and it
         stopped crawling them. src/lib/seo.js sets the per-route one; search
         bots get server-rendered pages from api/seo.js. -->

    <!-- Static share preview. Crawlers (WhatsApp, Twitter) do not run JS, so the
         per-route tags set by src/lib/seo.js only reach JS-rendering crawlers
         like Googlebot; these are the fallback everyone else sees. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ליגת הוקי הגלגיליות הישראלית" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="ליגת הוקי הגלגיליות הישראלית" />
    <meta property="og:description" content="ליגת הוקי הגלגיליות הישראלית — טבלת הליגה המעודכנת, תוצאות ולוח משחקים, סטטיסטיקות שחקנים וקבוצות, שידורים חיים, גלריית תמונות וטורנירים. כל מה שקורה במגרש, במקום אחד." />
    <meta property="og:url" content="https://rinkhockeyil.com/" />
    <meta property="og:image" content="https://rinkhockeyil.com/logos/main-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ליגת הוקי הגלגיליות הישראלית" />
    <meta name="twitter:description" content="ליגת הוקי הגלגיליות הישראלית — טבלת הליגה המעודכנת, תוצאות ולוח משחקים, סטטיסטיקות שחקנים וקבוצות, שידורים חיים, גלריית תמונות וטורנירים. כל מה שקורה במגרש, במקום אחד." />
    <meta name="twitter:image" content="https://rinkhockeyil.com/logos/main-logo.png" />
    <meta name="theme-color" content="#3B4FC4" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Logo + site name for Google. "/" is served THIS static file, even to search bots
         (Vercel serves index.html before the bot rewrite to api/seo.js can fire), so the
         league's identity has to be here, not only in the SPA. Organization data is valid
         on every page. Keep in step with api/seo.js (LOGO_PATH, SAME_AS) and
         organizationJsonLd() in src/lib/seo.js. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"SportsOrganization","@id":"https://rinkhockeyil.com/#league","name":"ליגת הוקי הגלגיליות הישראלית",
         "alternateName":["ליגת הוקי גלגיליות","RinkHockeyIL"],"url":"https://rinkhockeyil.com/","sport":"Roller hockey",
         "logo":{"@type":"ImageObject","url":"https://rinkhockeyil.com/logos/mark-512.png","width":512,"height":512},
         "image":"https://rinkhockeyil.com/logos/mark-512.png",
         "sameAs":["https://www.instagram.com/skateisrael_rinkhockey/"],
         "location":{"@type":"Country","name":"Israel"}},
        {"@type":"WebSite","@id":"https://rinkhockeyil.com/#site","name":"ליגת הוקי הגלגיליות הישראלית",
         "alternateName":["ליגת הוקי גלגיליות","rinkhockeyil.com"],"url":"https://rinkhockeyil.com/","inLanguage":"he-IL",
         "publisher":{"@id":"https://rinkhockeyil.com/#league"}}
      ]}
    </script>
  </head>
  <body>
    <!-- Opening animation, installed web app only (src/components/LaunchSplash.jsx).
         Decided here, before the bundle, so the blue covers the very first paint and a
         normal browser visit never waits. Live on rinkhockeyil.com since 2026-10-15
         (Ariel approved). ?splash=1 forces it in a browser tab on these hosts. -->
    <script>
      (function () {
        try {
          var h = location.hostname, q = location.search.indexOf('splash=1') !== -1;
          var host = h === 'localhost' || h === '127.0.0.1' || h === 'rinkhockeyil.com' || h === 'www.rinkhockeyil.com' || /^hockey-league-dev.*\.vercel\.app$/.test(h);
          var app = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
          var bot = /bot|crawl|spider|slurp|facebookexternalhit|whatsapp|preview/i.test(navigator.userAgent);
          var seen = sessionStorage.getItem('launch-splash') === '1';
          if (!host || bot || location.pathname !== '/' || (!app && !q) || (seen && !q)) return;
          sessionStorage.setItem('launch-splash', '1');
          window.__bootSplash = { reduced: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) };
          var d = document.createElement('div');
          d.id = 'boot-splash';
          d.style.cssText = 'position:fixed;inset:0;background:#3B4FC4;z-index:2147483000';
          document.body.appendChild(d);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
